name: llm-apt

x-app-environment: &app-environment
  LLMAPT_ENVIRONMENT: ${LLMAPT_ENVIRONMENT:-development}
  LLMAPT_LOG_LEVEL: ${LLMAPT_LOG_LEVEL:-INFO}
  LLMAPT_LOG_FORMAT: ${LLMAPT_LOG_FORMAT:-json}
  LLMAPT_DATABASE_URL: ${LLMAPT_DATABASE_URL:-postgresql+asyncpg://llmapt:local-postgres-change-me@postgres:5432/llmapt}
  LLMAPT_BROKER_URL: ${LLMAPT_BROKER_URL:-amqp://llmapt:local-rabbitmq-change-me@rabbitmq:5672//}
  LLMAPT_REDIS_URL: ${LLMAPT_REDIS_URL:-redis://redis:6379/0}
  LLMAPT_OBJECT_STORE_ENDPOINT: ${LLMAPT_OBJECT_STORE_ENDPOINT:-http://minio:9000}
  LLMAPT_OBJECT_STORE_BUCKET: ${LLMAPT_OBJECT_STORE_BUCKET:-llmapt-artifacts}
  LLMAPT_EXTERNAL_MODEL_CALLS_ENABLED: ${LLMAPT_EXTERNAL_MODEL_CALLS_ENABLED:-false}
  LLMAPT_MODEL_PROVIDER_KEY: ${LLMAPT_MODEL_PROVIDER_KEY:-external}
  LLMAPT_MODEL_PROVIDER_NAME: ${LLMAPT_MODEL_PROVIDER_NAME:-openai-compatible}
  LLMAPT_MODEL_NAME: ${LLMAPT_MODEL_NAME:-}
  LLMAPT_MODEL_REVISION: ${LLMAPT_MODEL_REVISION:-}
  LLMAPT_MODEL_API_ENDPOINT: ${LLMAPT_MODEL_API_ENDPOINT:-}
  LLMAPT_MODEL_API_KEY: ${LLMAPT_MODEL_API_KEY:-}
  LLMAPT_MODEL_TIMEOUT_SECONDS: ${LLMAPT_MODEL_TIMEOUT_SECONDS:-60}
  LLMAPT_RUNNER_URL: ${LLMAPT_RUNNER_URL:-http://runner:8080}
  LLMAPT_RUNNER_TOKEN: ${LLMAPT_RUNNER_TOKEN:-local-runner-change-me}
  LLMAPT_RUNNER_TIMEOUT_SECONDS: ${LLMAPT_RUNNER_TIMEOUT_SECONDS:-35}
  LLMAPT_AUTH_SECRET: ${LLMAPT_AUTH_SECRET:-local-auth-secret-change-me}
  LLMAPT_BOOTSTRAP_ADMIN_USERNAME: ${LLMAPT_BOOTSTRAP_ADMIN_USERNAME:-admin}
  LLMAPT_BOOTSTRAP_ADMIN_PASSWORD: ${LLMAPT_BOOTSTRAP_ADMIN_PASSWORD:-llmapt-local-change-me}
  LLMAPT_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${LLMAPT_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Local Administrator}
  LLMAPT_ACCESS_TOKEN_TTL_MINUTES: ${LLMAPT_ACCESS_TOKEN_TTL_MINUTES:-480}

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${LLMAPT_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    ports:
      - "${LLMAPT_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      runner:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - runner-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - llmapt.worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --concurrency=${LLMAPT_WORKER_CONCURRENCY:-2}
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from llmapt.worker.celery_app import celery_app;
          connection = celery_app.connection_for_read();
          connection.ensure_connection(max_retries=1);
          connection.close()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    environment:
      LLMAPT_RUNNER_TOKEN: ${LLMAPT_RUNNER_TOKEN:-local-runner-change-me}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /work:rw,exec,nosuid,size=256m,mode=1777
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmapt}
      POSTGRES_USER: ${POSTGRES_USER:-llmapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-llmapt}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-rabbitmq-change-me}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-llmapt}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-change-me-now}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:

networks:
  runner-net:
    internal: true
